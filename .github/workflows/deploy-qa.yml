name: Build and Deploy Docker Containers to EC2

on:
  push:
    branches:
      - QA  # O la rama que uses para producción

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker images
      run: |
        docker build -t alexmpz/update-service:latest ./update-service
        docker build -t alexmpz/get-service:latest ./get-service
        docker build -t alexmpz/delete-service:latest ./delete-service
        docker build -t alexmpz/create-service:latest ./create-service

    - name: Push Docker images to Docker Hub
      run: |
        docker push alexmpz/update-service:latest
        docker push alexmpz/get-service:latest
        docker push alexmpz/delete-service:latest
        docker push alexmpz/create-service:latest

    - name: SSH to EC2 and deploy Docker containers
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.EC2_IP }}  # IP pública de tu EC2
        username: ubuntu  # Nombre de usuario de EC2 (usualmente "ubuntu")
        key: ${{ secrets.EC2_PRIVATE_KEY }}  # Clave privada para acceder a EC2
        script: |
          # Iniciar sesión en Docker Hub
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          
          # Descargar las imágenes desde Docker Hub
          docker pull alexmpz/update-service:latest
          docker pull alexmpz/get-service:latest
          docker pull alexmpz/delete-service:latest
          docker pull alexmpz/create-service:latest
          
          # Comprobamos si las imágenes fueron descargadas correctamente
          docker images

          # Detener y eliminar contenedores anteriores si es necesario
          docker stop update-service get-service delete-service create-service || true
          docker rm update-service get-service delete-service create-service || true

          # Ejecutar los contenedores con variables de entorno desde GitHub Secrets
          docker run -d --name update-service -p ${{ secrets.UPDATE_SERVICE_PORT }}:${{ secrets.UPDATE_SERVICE_PORT }} \
            -e MONGO_URI=${{ secrets.MONGO_URI }} \
            -e DB_NAME=${{ secrets.DB_NAME }} \
            alexmpz/update-service:latest

          docker run -d --name get-service -p ${{ secrets.GET_SERVICE_PORT }}:${{ secrets.GET_SERVICE_PORT }} \
            -e MONGO_URI=${{ secrets.MONGO_URI }} \
            -e DB_NAME=${{ secrets.DB_NAME }} \
            alexmpz/get-service:latest

          docker run -d --name delete-service -p ${{ secrets.DELETE_SERVICE_PORT }}:${{ secrets.DELETE_SERVICE_PORT }} \
            -e MONGO_URI=${{ secrets.MONGO_URI }} \
            -e DB_NAME=${{ secrets.DB_NAME }} \
            alexmpz/delete-service:latest

          docker run -d --name create-service -p ${{ secrets.CREATE_SERVICE_PORT }}:${{ secrets.CREATE_SERVICE_PORT }} \
            -e MONGO_URI=${{ secrets.MONGO_URI }} \
            -e DB_NAME=${{ secrets.DB_NAME }} \
            alexmpz/create-service:latest
