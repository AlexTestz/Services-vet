name: Build and Deploy Docker Containers to EC2

on:
  push:
    branches:
      - main  # O la rama que uses para producción

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker images
      run: |
        docker build -t alexmpz/update-service:latest ./path/to/update-service
        docker build -t alexmpz/get-service:latest ./path/to/get-service
        docker build -t alexmpz/delete-service:latest ./path/to/delete-service
        docker build -t alexmpz/create-service:latest ./path/to/create-service

    - name: Push Docker images to Docker Hub
      run: |
        docker push alexmpz/update-service:latest
        docker push alexmpz/get-service:latest
        docker push alexmpz/delete-service:latest
        docker push alexmpz/create-service:latest

    - name: SSH to EC2 and deploy Docker containers
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.EC2_IP }}  # IP pública de tu EC2
        username: ubuntu # Nombre de usuario de EC2 (usualmente "ubuntu")
        key: ${{ secrets.EC2_PRIVATE_KEY }}  # Clave privada para acceder a EC2
        script: |
          # Iniciar sesión en Docker Hub
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          
          # Descargar las imágenes desde Docker Hub (si no se subieron)
          docker pull alexmpz/update-service:latest
          docker pull alexmpz/get-service:latest
          docker pull alexmpz/delete-service:latest
          docker pull alexmpz/create-service:latest
          
          # Detener y eliminar contenedores anteriores si es necesario
          docker stop update-service get-service delete-service create-service || true
          docker rm update-service get-service delete-service create-service || true

          # Ejecutar los contenedores
          docker run -d --name update-service -p 3015:3015 alexmpz/update-service:latest
          docker run -d --name get-service -p 3016:3016 alexmpz/get-service:latest
          docker run -d --name delete-service -p 3017:3017 alexmpz/delete-service:latest
          docker run -d --name create-service -p 3018:3018 alexmpz/create-service:latest
