name: Deploy Pet Host Services to EC2

on:
  push:
    branches:
      - test  # Cambia esta rama si la tuya es diferente

jobs:
  deploy:
    runs-on: ubuntu-latest  # Usamos Ubuntu para ejecutar los pasos

    steps:
    
    - name: Set up SSH key for EC2
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}  # Clave privada SSH de tu instancia EC2

    - name: Checkout repository
      uses: actions/checkout@v2  # Se realiza un checkout de tu código fuente

    - name: Build Docker images for services with tag "qa"
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/update-service:qa ./update-service
        docker build -t ${{ secrets.DOCKER_USERNAME }}/get-service:qa ./get-service
        docker build -t ${{ secrets.DOCKER_USERNAME }}/delete-service:qa ./delete-service
        docker build -t ${{ secrets.DOCKER_USERNAME }}/create-service:qa ./create-service

    - name: Push images to Docker Hub
      run: |
        docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}  # Login en Docker Hub
        docker push ${{ secrets.DOCKER_USERNAME }}/update-service:qa
        docker push ${{ secrets.DOCKER_USERNAME }}/get-service:qa
        docker push ${{ secrets.DOCKER_USERNAME }}/delete-service:qa
        docker push ${{ secrets.DOCKER_USERNAME }}/create-service:qa

    - name: Deploy services to EC2
      uses: appleboy/ssh-action@v1.0.0  # Usamos el SSH Action para ejecutar comandos en EC2
      with:
        host: ${{ secrets.EC2_PUBLIC_IP }}  # Referencia a la IP pública de EC2 desde los secretos
        username: ubuntu  # En Ubuntu, el nombre de usuario es típicamente "ubuntu"
        key: ${{ secrets.EC2_SSH_KEY }}  # La clave privada SSH para autenticarte
        script: |
          # Detener y eliminar contenedores anteriores si existen
          docker stop update-service || true
          docker rm update-service || true
          docker stop get-service || true
          docker rm get-service || true
          docker stop delete-service || true
          docker rm delete-service || true
          docker stop create-service || true
          docker rm create-service || true

          # Descargar las últimas imágenes desde Docker Hub con la etiqueta "qa"
          docker pull ${{ secrets.DOCKER_USERNAME }}/update-service:qa
          docker pull ${{ secrets.DOCKER_USERNAME }}/get-service:qa
          docker pull ${{ secrets.DOCKER_USERNAME }}/delete-service:qa
          docker pull ${{ secrets.DOCKER_USERNAME }}/create-service:qa

          # Ejecutar los nuevos contenedores con la etiqueta "qa"
          docker run -d --name update-service -p 3017:3017 ${{ secrets.DOCKER_USERNAME }}/update-service:qa
          docker run -d --name get-service -p 3016:3016 ${{ secrets.DOCKER_USERNAME }}/get-service:qa
          docker run -d --name delete-service -p 3018:3018 ${{ secrets.DOCKER_USERNAME }}/delete-service:qa
          docker run -d --name create-service -p 3015:3015 ${{ secrets.DOCKER_USERNAME }}/create-service:qa
