name: Build and Deploy to EC2

on:
  push:
    branches:
      - QA

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    # Paso 1: Checkout code.
    - name: Checkout code
      uses: actions/checkout@v2

    # Paso 2: Configuración Docker
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # Paso 3: Login Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Paso 4: Build and upload docker images  
    - name: Build and push Docker images
      run: |
        docker build -t alexmpz/create-service:latest ./create-service
        docker build -t alexmpz/get-service:latest ./get-service  
        docker build -t alexmpz/update-service:latest ./update-service
        docker build -t alexmpz/delete-service:latest ./delete-service

        docker push alexmpz/create-service:latest
        docker push alexmpz/get-service:latest
        docker push alexmpz/update-service:latest
        docker push alexmpz/delete-service:latest

    # Paso 5: Deploy en EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        port: 22
        script: |
          # Stop and delete old containers if they exist
          docker stop $(docker ps -aq) || true
          docker rm $(docker ps -aq) || true

          # Pull images from Docker Hub
          docker pull alexmpz/create-service:latest
          docker pull alexmpz/get-service:latest
          docker pull alexmpz/update-service:latest
          docker pull alexmpz/delete-service:latest

          # create-service en puerto 3015
          docker run -d -p 3015:3015 \
            -e MONGO_URI=${{ secrets.MONGO_URI }} \
            -e DB_NAME=${{ secrets.DB_NAME }} \
            alexmpz/create-service:latest

          # get-service en puerto 3016
          docker run -d -p 3016:3016 \
            -e MONGO_URI=${{ secrets.MONGO_URI }} \
            -e DB_NAME=${{ secrets.DB_NAME }} \
            alexmpz/get-service:latest

          # update-service en puerto 3017
          docker run -d -p 3017:3017 \
            -e MONGO_URI=${{ secrets.MONGO_URI }} \
            -e DB_NAME=${{ secrets.DB_NAME }} \
            alexmpz/update-service:latest

          # delete-service en puerto 3018
          docker run -d -p 3018:3018 \
            -e MONGO_URI=${{ secrets.MONGO_URI }} \
            -e DB_NAME=${{ secrets.DB_NAME }} \
            alexmpz/delete-service:latest
